  <!-- =========================================
       NEWS DETAILS CSS
  ========================================== -->

  <style>

    /* =================================================
       Daily Sheen V7
       Professional News Details Page
    ================================================= */


    /* ================================================
       RESET / BASE
    ================================================ */

    .details-page {

      width: 100%;

      max-width: 1200px;

      margin: 0 auto;

      padding:
        30px 20px 70px;

    }


    /* ================================================
       BREADCRUMB
    ================================================ */

    .news-breadcrumb {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 22px;

      color: #777;

      font-size: 14px;

    }


    .news-breadcrumb a {

      color: #5b21b6;

      text-decoration: none;

      font-weight: 600;

    }


    .news-breadcrumb a:hover {

      text-decoration: underline;

    }


    .breadcrumb-separator {

      color: #aaa;

    }


    /* ================================================
       MAIN LAYOUT
    ================================================ */

    .details-layout {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        320px;

      gap: 28px;

      align-items: start;

    }


    /* ================================================
       ARTICLE CARD
    ================================================ */

    .news-details-card {

      width: 100%;

      background: #ffffff;

      border-radius: 18px;

      padding: 30px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.10);

      overflow: hidden;

    }


    /* ================================================
       CATEGORY
    ================================================ */

    .news-details-category {

      display: inline-flex;

      align-items: center;

      padding:
        7px 14px;

      margin-bottom: 15px;

      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          #6a11cb,
          #2575fc
        );

      color: #fff;

      font-size: 13px;

      font-weight: 700;

    }


    /* ================================================
       TITLE
    ================================================ */

    .news-details-title {

      margin:
        0 0 16px;

      color: #171717;

      font-size: 38px;

      font-weight: 800;

      line-height: 1.45;

      letter-spacing: -0.3px;

      overflow-wrap: anywhere;

    }


    /* ================================================
       META
    ================================================ */

    .news-details-meta {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 16px;

      padding-bottom: 20px;

      margin-bottom: 22px;

      border-bottom:
        1px solid #eeeeee;

      color: #777;

      font-size: 13px;

    }


    .news-details-meta span {

      display: inline-flex;

      align-items: center;

      gap: 5px;

    }


    /* ================================================
       FEATURED IMAGE
    ================================================ */

    .news-details-image-wrapper {

      width: 100%;

      margin-bottom: 25px;

      border-radius: 15px;

      overflow: hidden;

      background: #f1f1f1;

    }


    .news-details-image {

      display: block;

      width: 100%;

      max-height: 600px;

      object-fit: cover;

    }


    /* ================================================
       ARTICLE CONTENT
    ================================================ */

    .news-details-description {

      color: #333;

      font-size: 18px;

      line-height: 2;

      white-space: pre-line;

      overflow-wrap: anywhere;

    }


    .news-details-description p {

      margin-bottom: 18px;

    }


    /* ================================================
       SHARE AREA
    ================================================ */

    .news-share-area {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 10px;

      padding-top: 25px;

      margin-top: 30px;

      border-top:
        1px solid #eeeeee;

    }


    .news-share-title {

      width: 100%;

      margin-bottom: 4px;

      color: #333;

      font-size: 15px;

      font-weight: 700;

    }


    .share-btn {

      border: none;

      border-radius: 8px;

      padding:
        10px 15px;

      color: #fff;

      font-family: inherit;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

    }


    .share-btn:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 6px 15px
        rgba(0,0,0,0.15);

    }


    .share-facebook {

      background: #1877f2;

    }


    .share-copy {

      background: #555;

    }


    /* ================================================
       BACK BUTTON
    ================================================ */

    .back-home-btn {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-top: 28px;

      padding:
        11px 20px;

      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          #6a11cb,
          #2575fc
        );

      color: #fff;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

    }


    .back-home-btn:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 7px 18px
        rgba(37, 117, 252, 0.3);

    }


    /* ================================================
       SIDEBAR
    ================================================ */

    .details-sidebar {

      position: sticky;

      top: 100px;

    }


    .sidebar-card {

      background: #fff;

      padding: 20px;

      margin-bottom: 20px;

      border-radius: 15px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.08);

    }


    .sidebar-title {

      position: relative;

      padding-bottom: 10px;

      margin-bottom: 15px;

      color: #333;

      font-size: 18px;

      font-weight: 800;

    }


    .sidebar-title::after {

      content: "";

      position: absolute;

      left: 0;

      bottom: 0;

      width: 45px;

      height: 3px;

      border-radius: 5px;

      background:
        linear-gradient(
          135deg,
          #6a11cb,
          #2575fc
        );

    }


    /* ================================================
       RELATED NEWS
    ================================================ */

    .related-news-list {

      display: flex;

      flex-direction: column;

      gap: 14px;

    }


    .related-news-item {

      display: flex;

      gap: 10px;

      padding-bottom: 12px;

      border-bottom:
        1px solid #eeeeee;

    }


    .related-news-item:last-child {

      border-bottom: none;

      padding-bottom: 0;

    }


    .related-news-image {

      width: 85px;

      height: 65px;

      flex-shrink: 0;

      object-fit: cover;

      border-radius: 7px;

      background: #eee;

    }


    .related-news-content {

      min-width: 0;

    }


    .related-news-content h4 {

      margin: 0 0 5px;

      color: #333;

      font-size: 13px;

      line-height: 1.5;

      display:
        -webkit-box;

      -webkit-line-clamp: 2;

      -webkit-box-orient: vertical;

      overflow: hidden;

    }


    .related-news-content a {

      color: inherit;

      text-decoration: none;

    }


    .related-news-content a:hover h4 {

      color: #5b21b6;

    }


    .related-news-date {

      color: #888;

      font-size: 10px;

    }


    /* ================================================
       LOADING
    ================================================ */

    .news-loading {

      min-height: 350px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: #666;

      font-size: 18px;

    }


    /* ================================================
       ERROR
    ================================================ */

    .news-error {

      padding: 60px 20px;

      text-align: center;

    }


    .news-error h2 {

      margin-bottom: 10px;

      color: #c62828;

      font-size: 22px;

    }


    .news-error p {

      color: #777;

      font-size: 14px;

    }


    /* ================================================
       BACK TO TOP
    ================================================ */

    #detailsTopBtn {

      position: fixed;

      right: 20px;

      bottom: 20px;

      width: 45px;

      height: 45px;

      display: none;

      align-items: center;

      justify-content: center;

      border: none;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #6a11cb,
          #2575fc
        );

      color: #fff;

      font-size: 20px;

      cursor: pointer;

      z-index: 999;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,0.2);

    }


    /* ================================================
       DARK MODE
    ================================================ */

    body.dark {

      background: #111827;

      color: #eee;

    }


    body.dark .news-details-card,

    body.dark .sidebar-card {

      background: #1f2937;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,0.3);

    }


    body.dark .news-details-title {

      color: #fff;

    }


    body.dark .news-details-description {

      color: #e5e7eb;

    }


    body.dark .news-details-meta,

    body.dark .news-share-area,

    body.dark .related-news-item {

      border-color:
        #374151;

    }


    body.dark .news-details-meta,

    body.dark .related-news-date {

      color: #bdbdbd;

    }


    body.dark .news-share-title,

    body.dark .sidebar-title,

    body.dark .related-news-content h4 {

      color: #fff;

    }


    body.dark .news-breadcrumb {

      color: #aaa;

    }


    body.dark .empty-related {

      color: #bbb;

    }


    /* ================================================
       RESPONSIVE
    ================================================ */

    @media (max-width: 950px) {

      .details-layout {

        grid-template-columns: 1fr;

      }


      .details-sidebar {

        position: static;

      }


      .related-news-list {

        display: grid;

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

      }

    }


    @media (max-width: 650px) {

      .details-page {

        padding:
          20px 12px 50px;

      }


      .news-details-card {

        padding:
          20px 15px;

        border-radius:
          13px;

      }


      .news-details-title {

        font-size:
          25px;

        line-height:
          1.5;

      }


      .news-details-description {

        font-size:
          16px;

        line-height:
          1.9;

      }


      .news-details-image {

        max-height:
          350px;

      }


      .news-details-meta {

        gap:
          10px;

      }


      .related-news-list {

        grid-template-columns:
          1fr;

      }


      .share-btn {

        flex:
          1;

      }

    }


    @media (max-width: 400px) {

      .news-details-title {

        font-size:
          22px;

      }


      .news-details-description {

        font-size:
          15px;

      }

    }

  </style>

</head>
